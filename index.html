<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshCart - Grocery Delivery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">FreshCart</div>
    <nav>
      <a href="#products">Shop</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="cart-icon" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</div>
  </header>

  <div id="cart-panel" class="cart-panel hidden">
    <h3>Your Cart</h3>
    <ul id="cart-items"></ul>
    <p id="cart-empty-msg">Your cart is empty.</p>
    <p id="cart-total"></p>
  </div>

  <section class="hero">
    <h1>Groceries delivered to your door</h1>
    <p>Fresh produce, pantry staples, and more — order in minutes.</p>
    <button>Start Shopping</button>
  </section>

  <section id="products" class="products">
    <h2>Popular Products</h2>
    <div class="product-grid" id="product-grid">
      <!-- Product cards used to be typed here by hand.
           Now JavaScript will build them automatically from the database. -->
    </div>
  </section>

  <footer>
    <p>&copy; 2026 FreshCart. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
