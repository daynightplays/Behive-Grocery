<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - Buyhive Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Buyhive Store</a>
    <nav>
      <a href="index.html">Shop</a>
    </nav>
    <a href="#" onclick="toggleAuth(); return false;" id="auth-link">Sign Up / Log In</a>
    <a href="#" onclick="toggleOrders(); return false;" id="orders-link" class="hidden">My Orders</a>
    <a href="checkout.html" class="cart-icon">🛒 Cart (<span id="cart-count">0</span>)</a>
  </header>

  <div class="search-bar-wrapper">
    <input type="text" id="search-input" placeholder="Search for products..." oninput="handleSearchInput()" onkeydown="handleSearchKey(event)" autocomplete="off">
    <div id="search-suggestions" class="hidden"></div>
  </div>

  <div id="orders-panel" class="cart-panel hidden">
    <h3>My Orders</h3>
    <div id="orders-list"></div>
  </div>

  <div id="auth-panel" class="cart-panel hidden">
    <div id="signup-view">
      <h3>Sign Up</h3>
      <input type="email" id="signup-email" placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password">
      <button onclick="signup()">Create Account</button>
      <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin(); return false;">Log in</a></p>
    </div>

    <div id="login-view" class="hidden">
      <h3>Log In</h3>
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <button onclick="login()">Log In</button>
      <p class="auth-switch">Need an account? <a href="#" onclick="showSignup(); return false;">Sign up</a></p>
    </div>

    <p id="auth-message"></p>
  </div>

  <section class="products">
    <h2 id="search-results-title">Search results</h2>
    <div class="product-grid" id="search-product-grid"></div>
  </section>

  <div id="cart-bar" class="cart-bar hidden">
    <span id="cart-bar-info"></span>
    <a href="checkout.html" class="cart-bar-btn">View Cart</a>
  </div>

  <script src="script.js"></script>
  <script src="search.js"></script>
</body>
</html>
