<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Buyhive Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Buyhive Store Admin</div>
    <a href="index.html" style="color: white;">← Back to site</a>
  </header>

  <div id="access-denied" class="hidden" style="padding: 40px; text-align: center;">
    <h2>Access denied</h2>
    <p>You must be logged in as an admin to view this page.</p>
  </div>

  <div id="admin-content" class="hidden" style="padding: 40px; max-width: 700px;">
    <h2>Add a Product</h2>
    <input type="text" id="new-name" placeholder="Product name">
    <select id="new-unit-select" onchange="toggleCustomUnitInput()">
      <option value="">-- Size/Unit (optional) --</option>
      <option value="100g">100g</option>
      <option value="250g">250g</option>
      <option value="500g">500g</option>
      <option value="1kg">1kg</option>
      <option value="250ml">250ml</option>
      <option value="500ml">500ml</option>
      <option value="1L">1L</option>
      <option value="2L">2L</option>
      <option value="1 piece">1 piece</option>
      <option value="Pack of 6">Pack of 6</option>
      <option value="Pack of 12">Pack of 12</option>
      <option value="__custom__">Custom...</option>
    </select>
    <input type="text" id="new-unit-custom" placeholder="Enter custom size/unit" class="hidden">
    <input type="number" id="new-price" placeholder="Price" step="0.01">
    <input type="text" id="new-variant-group" placeholder="Links sizes together (e.g. 'Lays Chips') — leave blank if this product has no size options">
    <input type="text" id="new-emoji" placeholder="Emoji (e.g. 🍎) — used if no photo is uploaded">
    <label class="upload-label" for="new-photo">📷 Upload Product Photo</label>
    <input type="file" id="new-photo" accept="image/*" onchange="showPhotoPreview()">
    <img id="photo-preview" class="hidden" alt="Preview">
    <input type="text" id="new-image-url" placeholder="Or paste an image URL (optional)">
    <select id="category-select" onchange="toggleNewCategoryInput()">
      <option value="">-- Select category --</option>
      <option value="__new__">+ Add a new category</option>
    </select>
    <input type="text" id="new-category-input" placeholder="New category name" class="hidden">
    <button onclick="addProduct()">Add Product</button>
    <p id="admin-message"></p>

    <h2 style="margin-top: 40px;">Current Products</h2>
    <div id="admin-product-list"></div>

    <div id="admin-orders-section">
      <h2 style="margin-top: 40px;">All Orders</h2>
      <div id="admin-orders-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
